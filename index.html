<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Taskify Pro</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#38bdf8" />
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Arial,sans-serif;
      background:linear-gradient(135deg,#0b1220,#111827);
      color:white;
      display:flex;
      justify-content:center;
      min-height:100vh;
    }
    .app{width:100%;max-width:560px;padding:20px;}
    .card{
      background:#0b1220;
      border:1px solid #1f2937;
      border-radius:16px;
      padding:18px;
      box-shadow:0 10px 40px rgba(0,0,0,0.5);
    }
    h1{margin:0;text-align:center;color:#38bdf8}
    p{text-align:center;color:#94a3b8;font-size:12px}
    .grid{display:grid;gap:10px}
    input,select{padding:10px;border-radius:10px;border:none;outline:none;}
    button{
      padding:10px;border:none;border-radius:10px;
      cursor:pointer;font-weight:bold;
      background:#38bdf8;color:black;
    }
    ul{list-style:none;padding:0;margin-top:15px}
    li{
      background:#111827;margin-bottom:10px;padding:12px;
      border-radius:12px;display:flex;
      justify-content:space-between;align-items:center;
    }
    .done{text-decoration:line-through;opacity:.5}
    .tag{font-size:10px;padding:3px 8px;border-radius:20px}
    .low{background:#22c55e;color:black}
    .medium{background:#facc15;color:black}
    .high{background:#ef4444;color:white}
    .topbar{
      display:flex;justify-content:space-between;
      font-size:12px;color:#94a3b8;margin-bottom:10px;
    }
    .small{font-size:11px;color:#94a3b8}
  </style>
</head>
<body>

<div class="app">
  <div class="card">
    <h1>Taskify Pro</h1>
    <p>Production Ready • Firebase • PWA • AI Ready</p>

    <div class="topbar">
      <span id="status">Not logged in</span>
      <button onclick="logout()" style="padding:6px 10px;font-size:11px">Logout</button>
    </div>

    <div class="grid">
      <input id="email" placeholder="Email" />
      <input id="password" type="password" placeholder="Password" />
      <button onclick="doAuth()">Login / Signup</button>
    </div>

    <hr style="border:1px solid #1f2937;margin:15px 0" />

    <div class="grid">
      <input id="task" placeholder="New task" />
      <select id="priority">
        <option value="low">Low</option>
        <option value="medium">Medium</option>
        <option value="high">High</option>
      </select>
      <button onclick="addTask()">Add Task</button>
    </div>

    <ul id="list"></ul>

    <p class="small">Firebase + AI hooks enabled (connect your config below)</p>
  </div>
</div>

<!-- Firebase SDK (CDN) -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBojMhapnrZfZ0oBdfGi38nIlCtKO2hN24",
  authDomain: "taskify-256.firebaseapp.com",
  databaseURL: "https://taskify-256-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "taskify-256",
  storageBucket: "taskify-256.firebasestorage.app",
  messagingSenderId: "969452741266",
  appId: "1:969452741266:web:5939c209685be1b1567c4b"
};

let app, auth, db;
try {
  app = firebase.initializeApp(firebaseConfig);
  auth = firebase.auth();
  db = firebase.firestore();
} catch(e) {
  console.log("Firebase error:", e);
}

let user = null;
let tasks = JSON.parse(localStorage.getItem("tasks")) || [];

function saveLocal() {
  localStorage.setItem("tasks", JSON.stringify(tasks));
}

function doAuth() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  if (!email || !password) return alert("Fill all fields");

  if (!auth) {
    user = { email };
    document.getElementById("status").innerText = "Demo: " + email;
    return;
  }

  auth.signInWithEmailAndPassword(email, password)
    .catch(() => auth.createUserWithEmailAndPassword(email, password))
    .then(res => {
      user = res.user;
      document.getElementById("status").innerText = "Logged in: " + email;
    })
    .catch(err => alert(err.message));
}

function logout() {
  user = null;
  document.getElementById("status").innerText = "Not logged in";
}

function addTask() {
  const t = document.getElementById("task").value;
  const p = document.getElementById("priority").value;
  if (!t.trim()) return;
  tasks.push({ text: t, priority: p, done: false });
  saveLocal();
  render();
  document.getElementById("task").value = "";
}

function toggle(i) { tasks[i].done = !tasks[i].done; saveLocal(); render(); }
function del(i) { tasks.splice(i, 1); saveLocal(); render(); }

function render() {
  const list = document.getElementById("list");
  list.innerHTML = "";
  tasks.forEach((t, i) => {
    const li = document.createElement("li");
    li.innerHTML = `
      <span onclick="toggle(${i})" style="cursor:pointer" class="${t.done ? 'done' : ''}">${t.text}</span>
      <span class="tag ${t.priority}">${t.priority}</span>
      <button onclick="del(${i})" style="background:red;color:white;border:none;padding:5px 8px;border-radius:6px">X</button>
    `;
    list.appendChild(li);
  });
}

render();

// Register Service Worker
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js")
    .then(() => console.log("SW registered"))
    .catch(() => console.log("SW failed"));
}
</script>

</body>
</html>
