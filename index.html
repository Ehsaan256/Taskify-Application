<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Taskify — Smart Todo</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#080c14;
  --surface:#0e1420;
  --card:#131a28;
  --border:#1e2d45;
  --accent:#00d4ff;
  --accent2:#7c3aed;
  --green:#10b981;
  --yellow:#f59e0b;
  --red:#ef4444;
  --text:#e2e8f0;
  --muted:#4a5568;
  --radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'DM Sans',sans-serif;
  min-height:100vh;
  overflow-x:hidden;
}
/* BG orbs */
.orb{position:fixed;border-radius:50%;filter:blur(80px);pointer-events:none;z-index:0}
.orb1{width:400px;height:400px;background:rgba(0,212,255,0.06);top:-100px;right:-100px}
.orb2{width:350px;height:350px;background:rgba(124,58,237,0.06);bottom:100px;left:-80px}

/* LAYOUT */
.app{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:20px}

/* NAV */
nav{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 24px;background:rgba(13,20,36,0.8);
  border:1px solid var(--border);border-radius:var(--radius);
  backdrop-filter:blur(20px);margin-bottom:24px;
}
.logo{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent}
.nav-tabs{display:flex;gap:4px}
.nav-tab{
  padding:8px 16px;border-radius:10px;border:none;background:transparent;
  color:var(--muted);font-family:'DM Sans',sans-serif;font-size:13px;
  cursor:pointer;transition:.2s
}
.nav-tab.active,.nav-tab:hover{background:var(--border);color:var(--text)}

/* PAGES */
.page{display:none}
.page.active{display:block;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* STATS ROW */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
.stat-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:16px;text-align:center;
  transition:.2s;
}
.stat-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.stat-num{font-family:'Syne',sans-serif;font-size:28px;font-weight:800;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent}
.stat-label{font-size:11px;color:var(--muted);margin-top:4px;text-transform:uppercase;letter-spacing:.5px}

/* PROGRESS */
.progress-wrap{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:20px;margin-bottom:24px;
}
.progress-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.progress-title{font-family:'Syne',sans-serif;font-weight:700;font-size:15px}
.progress-pct{font-size:13px;color:var(--accent)}
.progress-bar{height:8px;background:var(--border);border-radius:999px;overflow:hidden}
.progress-fill{
  height:100%;border-radius:999px;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  transition:width .6s cubic-bezier(.4,0,.2,1);
}

/* SEARCH + FILTER */
.toolbar{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.search-wrap{flex:1;min-width:200px;position:relative}
.search-wrap input{
  width:100%;padding:12px 16px 12px 42px;
  background:var(--card);border:1px solid var(--border);
  border-radius:12px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;
  outline:none;transition:.2s;
}
.search-wrap input:focus{border-color:var(--accent)}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:16px}
.filter-btn{
  padding:12px 16px;background:var(--card);border:1px solid var(--border);
  border-radius:12px;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:13px;
  cursor:pointer;transition:.2s;white-space:nowrap;
}
.filter-btn.active,.filter-btn:hover{border-color:var(--accent);color:var(--accent)}

/* ADD TASK FORM */
.add-form{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:20px;margin-bottom:24px;
}
.add-form h3{font-family:'Syne',sans-serif;font-size:16px;font-weight:700;margin-bottom:16px;color:var(--accent)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-full{grid-column:1/-1}
.form-input{
  padding:12px 16px;background:var(--surface);border:1px solid var(--border);
  border-radius:12px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;
  outline:none;width:100%;transition:.2s;
}
.form-input:focus{border-color:var(--accent)}
.form-input::placeholder{color:var(--muted)}
select.form-input option{background:var(--surface)}
.add-btn{
  grid-column:1/-1;padding:14px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  border:none;border-radius:12px;color:white;font-family:'Syne',sans-serif;
  font-size:15px;font-weight:700;cursor:pointer;transition:.2s;
}
.add-btn:hover{opacity:.9;transform:translateY(-1px)}
.add-btn:active{transform:translateY(0)}

/* TASK LIST */
.section-title{
  font-family:'Syne',sans-serif;font-size:14px;font-weight:700;
  color:var(--muted);text-transform:uppercase;letter-spacing:1px;
  margin-bottom:12px;margin-top:8px;
}
.task-item{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:16px;margin-bottom:10px;
  display:flex;align-items:center;gap:14px;
  transition:.25s;position:relative;overflow:hidden;
}
.task-item::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
  border-radius:3px 0 0 3px;
}
.task-item.high::before{background:var(--red)}
.task-item.medium::before{background:var(--yellow)}
.task-item.low::before{background:var(--green)}
.task-item:hover{border-color:var(--border);transform:translateX(3px)}
.task-item.completed{opacity:.5}
.task-item.completed .task-text{text-decoration:line-through}

.task-check{
  width:22px;height:22px;border-radius:8px;border:2px solid var(--border);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:.2s;background:transparent;
}
.task-check:hover{border-color:var(--accent)}
.task-check.checked{background:var(--green);border-color:var(--green)}
.task-check.checked::after{content:'✓';color:white;font-size:13px;font-weight:bold}

.task-body{flex:1;min-width:0}
.task-text{font-size:15px;font-weight:500;margin-bottom:4px;word-break:break-word}
.task-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag{
  font-size:10px;padding:3px 9px;border-radius:20px;font-weight:600;
  text-transform:uppercase;letter-spacing:.5px;
}
.tag-cat{background:rgba(124,58,237,0.2);color:#a78bfa}
.tag-high{background:rgba(239,68,68,0.2);color:#fca5a5}
.tag-medium{background:rgba(245,158,11,0.2);color:#fcd34d}
.tag-low{background:rgba(16,185,129,0.2);color:#6ee7b7}
.task-due{font-size:11px;color:var(--muted)}
.task-due.overdue{color:var(--red)}

.task-actions{display:flex;gap:6px;flex-shrink:0}
.icon-btn{
  width:32px;height:32px;border-radius:8px;border:1px solid var(--border);
  background:transparent;color:var(--muted);cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:14px;
  transition:.2s;
}
.icon-btn:hover{border-color:var(--accent);color:var(--accent)}
.icon-btn.del:hover{border-color:var(--red);color:var(--red)}

/* EDIT MODAL */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.7);
  backdrop-filter:blur(8px);z-index:100;
  display:none;align-items:center;justify-content:center;padding:20px;
}
.modal-overlay.open{display:flex}
.modal{
  background:var(--card);border:1px solid var(--border);
  border-radius:20px;padding:28px;width:100%;max-width:480px;
  animation:fadeIn .2s ease;
}
.modal h3{font-family:'Syne',sans-serif;font-weight:800;font-size:18px;margin-bottom:20px;color:var(--accent)}
.modal-btns{display:flex;gap:10px;margin-top:16px}
.btn-cancel{
  flex:1;padding:12px;background:var(--surface);border:1px solid var(--border);
  border-radius:10px;color:var(--muted);font-family:'DM Sans',sans-serif;cursor:pointer;
}
.btn-save{
  flex:1;padding:12px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  border:none;border-radius:10px;color:white;font-family:'Syne',sans-serif;
  font-weight:700;cursor:pointer;
}

/* POMODORO */
.pomodoro-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:32px;text-align:center;margin-bottom:24px;
}
.pomo-ring{
  width:180px;height:180px;margin:0 auto 24px;
  position:relative;display:flex;align-items:center;justify-content:center;
}
.pomo-ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.pomo-ring circle{fill:none;stroke-width:8;stroke-linecap:round}
.pomo-bg{stroke:var(--border)}
.pomo-progress{stroke:url(#grad);transition:stroke-dashoffset .5s ease}
.pomo-time{
  font-family:'Syne',sans-serif;font-size:42px;font-weight:800;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.pomo-label{font-size:12px;color:var(--muted);margin-top:4px;text-transform:uppercase;letter-spacing:1px}
.pomo-btns{display:flex;gap:12px;justify-content:center;margin-top:20px}
.pomo-btn{
  padding:12px 28px;border-radius:12px;border:none;font-family:'Syne',sans-serif;
  font-weight:700;cursor:pointer;font-size:14px;transition:.2s;
}
.pomo-start{background:linear-gradient(135deg,var(--accent),var(--accent2));color:white}
.pomo-reset{background:var(--surface);border:1px solid var(--border);color:var(--muted)}
.pomo-modes{display:flex;gap:8px;justify-content:center;margin-bottom:20px}
.pomo-mode{
  padding:8px 16px;border-radius:10px;border:1px solid var(--border);
  background:transparent;color:var(--muted);font-size:12px;cursor:pointer;transition:.2s;
}
.pomo-mode.active{border-color:var(--accent);color:var(--accent)}

/* ANALYTICS */
.analytics-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px}
.analytics-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:20px;
}
.analytics-card h4{font-family:'Syne',sans-serif;font-size:14px;font-weight:700;margin-bottom:16px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.bar-chart{display:flex;align-items:flex-end;gap:8px;height:80px}
.bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
.bar{
  width:100%;border-radius:6px 6px 0 0;
  background:linear-gradient(180deg,var(--accent),var(--accent2));
  transition:.6s cubic-bezier(.4,0,.2,1);min-height:4px;
}
.bar-lbl{font-size:10px;color:var(--muted)}
.donut-wrap{display:flex;align-items:center;gap:16px}
.donut{width:80px;height:80px;flex-shrink:0}
.donut-legend{display:flex;flex-direction:column;gap:6px}
.legend-item{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.legend-dot{width:10px;height:10px;border-radius:50%}

/* QUOTE */
.quote-card{
  background:linear-gradient(135deg,rgba(0,212,255,0.08),rgba(124,58,237,0.08));
  border:1px solid rgba(0,212,255,0.2);
  border-radius:var(--radius);padding:20px;margin-bottom:24px;
  text-align:center;
}
.quote-text{font-size:15px;font-style:italic;color:var(--text);line-height:1.6}
.quote-author{font-size:12px;color:var(--accent);margin-top:8px}

/* STREAK */
.streak-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:20px;margin-bottom:24px;
  display:flex;align-items:center;gap:16px;
}
.streak-fire{font-size:40px}
.streak-info h3{font-family:'Syne',sans-serif;font-size:24px;font-weight:800;
  background:linear-gradient(135deg,#f59e0b,#ef4444);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent}
.streak-info p{font-size:12px;color:var(--muted)}

/* EMPTY STATE */
.empty{text-align:center;padding:48px 24px;color:var(--muted)}
.empty-icon{font-size:48px;margin-bottom:12px}
.empty p{font-size:14px}

/* CONFETTI */
.confetti-piece{
  position:fixed;width:8px;height:8px;border-radius:2px;
  pointer-events:none;z-index:9999;
  animation:confettiFall 1.2s ease-in forwards;
}
@keyframes confettiFall{
  0%{transform:translateY(-20px) rotate(0deg);opacity:1}
  100%{transform:translateY(100vh) rotate(720deg);opacity:0}
}

/* RESPONSIVE */
@media(max-width:600px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .form-grid{grid-template-columns:1fr}
  .analytics-grid{grid-template-columns:1fr}
  .nav-tabs{display:none}
  .mobile-nav{display:flex!important}
}
.mobile-nav{
  display:none;position:fixed;bottom:0;left:0;right:0;
  background:rgba(13,20,36,0.95);border-top:1px solid var(--border);
  padding:8px;gap:0;z-index:50;backdrop-filter:blur(20px);
}
.mobile-tab{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:8px;border:none;background:transparent;color:var(--muted);
  font-size:10px;cursor:pointer;transition:.2s;border-radius:10px;
}
.mobile-tab.active,.mobile-tab:hover{color:var(--accent)}
.mobile-tab span:first-child{font-size:20px}

@media(max-width:600px){.app{padding-bottom:80px}}
</style>
</head>
<body>

<div class="orb orb1"></div>
<div class="orb orb2"></div>

<!-- Edit Modal -->
<div class="modal-overlay" id="editModal">
  <div class="modal">
    <h3>✏️ Edit Task</h3>
    <div style="display:grid;gap:12px">
      <input class="form-input" id="editText" placeholder="Task title"/>
      <input class="form-input" id="editDesc" placeholder="Description (optional)"/>
      <select class="form-input" id="editCat">
        <option value="Work">💼 Work</option>
        <option value="Study">📚 Study</option>
        <option value="Personal">🏠 Personal</option>
        <option value="Health">💪 Health</option>
      </select>
      <select class="form-input" id="editPriority">
        <option value="high">🔴 High Priority</option>
        <option value="medium">🟡 Medium Priority</option>
        <option value="low">🟢 Low Priority</option>
      </select>
      <input class="form-input" type="date" id="editDue"/>
    </div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeEdit()">Cancel</button>
      <button class="btn-save" onclick="saveEdit()">Save Changes</button>
    </div>
  </div>
</div>

<div class="app">

  <!-- NAV -->
  <nav>
    <div class="logo">⚡ Taskify</div>
    <div class="nav-tabs">
      <button class="nav-tab active" onclick="showPage('dashboard',this)">Dashboard</button>
      <button class="nav-tab" onclick="showPage('tasks',this)">Tasks</button>
      <button class="nav-tab" onclick="showPage('pomodoro',this)">Pomodoro</button>
      <button class="nav-tab" onclick="showPage('analytics',this)">Analytics</button>
    </div>
  </nav>

  <!-- DASHBOARD PAGE -->
  <div class="page active" id="page-dashboard">

    <div class="quote-card" id="quoteCard">
      <div class="quote-text">"The secret of getting ahead is getting started."</div>
      <div class="quote-author">— Mark Twain</div>
    </div>

    <div class="streak-card">
      <div class="streak-fire">🔥</div>
      <div class="streak-info">
        <h3 id="streakCount">0 Days</h3>
        <p>Current productivity streak</p>
      </div>
    </div>

    <div class="stats">
      <div class="stat-card">
        <div class="stat-num" id="statTotal">0</div>
        <div class="stat-label">Total Tasks</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="statDone">0</div>
        <div class="stat-label">Completed</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="statPending">0</div>
        <div class="stat-label">Pending</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="statOverdue">0</div>
        <div class="stat-label">Overdue</div>
      </div>
    </div>

    <div class="progress-wrap">
      <div class="progress-header">
        <span class="progress-title">Today's Progress</span>
        <span class="progress-pct" id="progressPct">0%</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill" style="width:0%"></div>
      </div>
    </div>

    <div class="section-title">Today's Tasks</div>
    <div id="todayList"></div>

  </div>

  <!-- TASKS PAGE -->
  <div class="page" id="page-tasks">

    <!-- Add Form -->
    <div class="add-form">
      <h3>+ Add New Task</h3>
      <div class="form-grid">
        <input class="form-input form-full" id="taskTitle" placeholder="Task title *"/>
        <input class="form-input form-full" id="taskDesc" placeholder="Description (optional)"/>
        <select class="form-input" id="taskCat">
          <option value="Work">💼 Work</option>
          <option value="Study">📚 Study</option>
          <option value="Personal">🏠 Personal</option>
          <option value="Health">💪 Health</option>
        </select>
        <select class="form-input" id="taskPriority">
          <option value="high">🔴 High Priority</option>
          <option value="medium">🟡 Medium Priority</option>
          <option value="low">🟢 Low Priority</option>
        </select>
        <input class="form-input form-full" type="date" id="taskDue"/>
        <button class="add-btn" onclick="addTask()">✨ Add Task</button>
      </div>
    </div>

    <!-- Search & Filter -->
    <div class="toolbar">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input placeholder="Search tasks..." id="searchInput" oninput="renderTasks()"/>
      </div>
      <button class="filter-btn active" onclick="setFilter('all',this)">All</button>
      <button class="filter-btn" onclick="setFilter('active',this)">Active</button>
      <button class="filter-btn" onclick="setFilter('completed',this)">Done</button>
    </div>

    <!-- Category filter -->
    <div class="toolbar" style="margin-bottom:16px">
      <button class="filter-btn active" onclick="setCat('all',this)">All</button>
      <button class="filter-btn" onclick="setCat('Work',this)">💼 Work</button>
      <button class="filter-btn" onclick="setCat('Study',this)">📚 Study</button>
      <button class="filter-btn" onclick="setCat('Personal',this)">🏠 Personal</button>
      <button class="filter-btn" onclick="setCat('Health',this)">💪 Health</button>
    </div>

    <div id="taskList"></div>

  </div>

  <!-- POMODORO PAGE -->
  <div class="page" id="page-pomodoro">
    <div class="pomodoro-card">
      <h2 style="font-family:'Syne',sans-serif;font-size:22px;margin-bottom:20px">🍅 Pomodoro Timer</h2>
      <div class="pomo-modes">
        <button class="pomo-mode active" onclick="setPomoMode(25,'Focus',this)">Focus 25m</button>
        <button class="pomo-mode" onclick="setPomoMode(5,'Short Break',this)">Short Break</button>
        <button class="pomo-mode" onclick="setPomoMode(15,'Long Break',this)">Long Break</button>
      </div>
      <div class="pomo-ring">
        <svg width="180" height="180" viewBox="0 0 180 180">
          <defs>
            <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" style="stop-color:#00d4ff"/>
              <stop offset="100%" style="stop-color:#7c3aed"/>
            </linearGradient>
          </defs>
          <circle class="pomo-bg" cx="90" cy="90" r="80" stroke-dasharray="502" stroke-dashoffset="0"/>
          <circle class="pomo-progress" id="pomoCircle" cx="90" cy="90" r="80"
            stroke-dasharray="502" stroke-dashoffset="0"/>
        </svg>
        <div>
          <div class="pomo-time" id="pomoTime">25:00</div>
          <div class="pomo-label" id="pomoLabel">Focus</div>
        </div>
      </div>
      <div class="pomo-btns">
        <button class="pomo-btn pomo-start" onclick="togglePomo()" id="pomoBtn">▶ Start</button>
        <button class="pomo-b
